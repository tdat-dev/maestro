<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Maestro for Chrome</title>
<style>
  :root {
    --bg: #111114; --panel: #1a1a1f; --line: #2a2a31; --text: #ececf1; --muted: #9a9aa6;
    --ok: oklch(0.78 0.14 150); --warn: oklch(0.82 0.13 80); --bad: oklch(0.7 0.17 25);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 300px; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  header img { width: 22px; height: 22px; }
  header b { font-size: 14px; font-weight: 600; }
  main { padding: 14px 16px 16px; display: grid; gap: 12px; }
  .state { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .ready .dot { background: var(--ok); }
  .hub-down .dot, .connecting .dot { background: var(--warn); }
  .no-host .dot, .offline .dot { background: var(--bad); }
  p { margin: 0; color: var(--muted); }
  .who { color: var(--muted); font-size: 12px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  li { display: flex; justify-content: space-between; padding: 7px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  li span { color: var(--muted); }
  h2 { margin: 0; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
</style>
</head>
<body>
<header><img src="icons/32.png" alt="" /><b>Maestro for Chrome</b></header>
<main>
  <div id="state" class="state"><span class="dot"></span><span id="label">Checking…</span></div>
  <p id="detail"></p>
  <div class="who" id="who"></div>
  <section id="agentsBox" hidden>
    <h2>Agents using this browser</h2>
    <ul id="agents"></ul>
  </section>
</main>
<script src="popup.js" type="module"></script>
</body>
</html>
